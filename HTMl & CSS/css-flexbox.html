<html>
    <head>
        <title> CSS Flexbox</title>
        <style>
            /*To arrange group element in single dimesnion*/
            .main{
                display:flex;
                flex-direction:row;
                flex-wrap: wrap;
                height: 100vh;
                border: 4px solid black;
                justify-content:center;
                align-items:center;
            }
            .one{
                width: 200px;
                height: 200px;
                background-color: aquamarine;
                font-size: 100px;
                text-align: center;
                border: 2px solid black;
            }
            .two{
                width: 200px;
                height: 200px;
                background-color: rgb(231, 31, 154);
                font-size: 100px;
                text-align: center;
                border: 2px solid black;
            }
            .three{
                width: 200px;
                height: 200px;
                background-color: rgb(30, 11, 203);
                font-size: 100px;
                text-align: center;
                border: 2px solid black;
            }
            .four{
                width: 200px;
                height: 200px;
                background-color: rgb(25, 244, 98);
                font-size: 100px;
                text-align: center;
                border: 2px solid black;
            }
            .five{
                width: 200px;
                height: 200px;
                background-color: rgb(228, 243, 64);
                font-size: 100px;
                text-align: center;
                border: 2px solid black;
            }
            .six{
                width: 200px;
                height: 200px;
                background-color: rgb(166, 84, 48);
                font-size: 100px;
                text-align: center;
                border: 2px solid black;
            }
        </style>
    </head>
    <body>
        <div class="main">
            <div class="one"> 1 </div>
            <div class="two"> 2 </div>
            <div class="three"> 3 </div>
            <div class="four"> 4 </div>
            <div class="five"> 5 </div>
            <div class="six"> 6 </div>
        </div>
    </body>
</html>
