<html>
    <head>
        <title> CSS Grid</title>
        <style>
            .main{
                display: grid;
                grid-template-columns: 30% 40% 30% ;
                column-gap: 20px;
                flex-wrap: wrap;
            }   
            .one{
                height: 400px;
                width: auto;
                background-color: rgba(221, 13, 45, 0.868);
                border: 2px solid black;
            }
            .two{
                height: 400px;
                width: auto;
                background-color: rgba(197, 221, 13, 0.868);
                border: 2px solid black;
            }
            .three{
                height: 400px;
                width: auto;
                background-color: rgba(13, 221, 44, 0.868);
                border: 2px solid black;
            }
        </style>
    </head>
    <body>
        <div class="main">
            <div class="one">1</div>
            <div class="two">2</div>
            <div class="three">3</div>
        </div>
    </body>
</html>
