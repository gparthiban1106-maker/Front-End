<html>
    <head>
        <title> CSS TEXT LEARING</title>
        <style>
            h1{
                color: blue;
                text-decoration-line: underline overline;
                text-decoration-color: red;
                text-decoration-style: dashed;
                text-decoration-thickness: 5px;
                text-transform: capitalize;
            }
            p{
                text-indent: 30px;
                letter-spacing: 5px;
                word-spacing: 20px;
                line-height: 20px;
            }
        </style>
    </head>
    <body>
        <h1> Hello world </h1>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolores veniam numquam praesentium deleniti nisi aliquid, 
            officiis eos! Cupiditate autem iusto ab velit ut, voluptatum distinctio illo, possimus repellat, dolorem vitae.</p>
    </body>
</html>
