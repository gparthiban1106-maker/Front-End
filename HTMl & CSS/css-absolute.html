<html>
    <head>
        <title> CSS Absolute</title>
        <style>
            .outer{
                height: 400px;
                width: 800px;
                position: relative;
                border: 2px solid black;
            }
            .inner{
                position: absolute;
                top: 40px;
                left: 40px;
                font-weight: 100px;
                font-size: 50px;
            }
        </style>
    </head>
    <body>
        <div class="outer">
            <div class="inner">My Name is Parthiban</div>
        </div>
    </body>
</html>
