<html>
    <head>
        <title> CSS Absolute</title>
        <style>
            .outer{
                height: 400px;
                width: 800px;
                /*position: relative;*/
                border: 2px solid black;
            }
            .inner{
                position: absolute;
                top: 70px;
                right: 20px;

            }
        </style>
    </head>
    <body>
        <div class="outer">
            <div class="inner">Inner text </div>
        </div>
    </body>
</html>
