<html>
    <head>  
        <title>CSS Box</title>
        <style>
            .one{
                height: 300px;
                width: 400px;
                border: 2px solid black;
                background-color: aqua;
                text-align: center;
            }
            .two{
                height: 300px;
                width: 400px;
                border: 2px solid black;
                background-color:brown;
                text-align: center;
                padding: 50px;
                box-sizing: border-box;
            }
        </style>    
    </head>
    <body>
        <div class="one">Class One</div>
            <div class="two">Class Two</div>
    </body>
</html>
